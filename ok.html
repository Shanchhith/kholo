<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Smile check</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; font-family: 'Poppins', system-ui, sans-serif; color: #2a3a3a; }
  body {
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #ffe9c7 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 20px;
  }
  .card {
    width: 100%; max-width: 400px; text-align: center;
    background: rgba(255,255,255,0.85); border-radius: 26px;
    padding: 28px 22px 24px; box-shadow: 0 24px 60px rgba(45,90,90,0.16);
  }
  h1 { font-family: 'Dancing Script', cursive; font-size: 2rem; color: #2d8a8a; margin: 0 0 4px; }
  .sub { font-size: 0.86rem; color: #6b8f8f; margin: 0 0 18px; }
  .pic {
    width: 240px; height: 240px; margin: 0 auto 20px; border-radius: 50%;
    border: 6px solid #fff; box-shadow: 0 14px 34px rgba(45,90,90,0.22);
    background: #eef6f5; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; color: #8bb3b3;
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row { display: flex; gap: 10px; }
  .btn {
    flex: 1; border: none; border-radius: 999px; padding: 16px 10px;
    font: inherit; font-size: 1.05rem; font-weight: 600; color: #fff; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn[disabled] { opacity: 0.55; pointer-events: none; }
  .ok { background: linear-gradient(135deg, #4fc3c3, #2d8a8a); box-shadow: 0 10px 24px rgba(45,138,138,0.3); }
  .no { background: linear-gradient(135deg, #f08a7e, #c25b52); box-shadow: 0 10px 24px rgba(194,91,82,0.3); }
  .done { display: none; margin-top: 18px; font-size: 1rem; font-weight: 600; color: #2d8a8a; }
  .done.show { display: block; }
  .err { color: #c25b52; }
</style>
</head>
<body>
  <div class="card">
    <h1>Smile check</h1>
    <p class="sub">Teeth dikh rahe hain?</p>
    <div class="pic" id="pic">loading her photo…</div>
    <div class="row" id="row">
      <button class="btn no" id="retake">✗ Retake</button>
      <button class="btn ok" id="approve">✓ Approve</button>
    </div>
    <p class="done" id="done"></p>
  </div>

<script>
  const HER_TOPIC = 'aditi-xoc6o62hw1mo17';
  const APPROVE_TOPIC = 'kholo-ok-actlc0qwblmgag';
  const $ = id => document.getElementById(id);

  // Show the most recent photo she sent (ntfy keeps attachments ~3h).
  fetch('https://ntfy.sh/' + HER_TOPIC + '/json?poll=1&since=3h')
    .then(r => r.text())
    .then(t => {
      const msgs = t.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (_) { return null; } })
        .filter(m => m && m.event === 'message' && m.attachment && m.attachment.url);
      const last = msgs[msgs.length - 1];
      if (last) $('pic').innerHTML = '<img src="' + last.attachment.url + '" alt="her smile">';
      else $('pic').textContent = 'photo not found, check the notification';
    })
    .catch(() => { $('pic').textContent = 'photo not found, check the notification'; });

  async function send(verdict, label) {
    $('approve').disabled = true; $('retake').disabled = true;
    try {
      const r = await fetch('https://ntfy.sh/' + APPROVE_TOPIC, { method: 'POST', body: verdict });
      if (!r.ok) throw new Error(r.status);
      $('row').style.display = 'none';
      $('done').textContent = label;
      $('done').className = 'done show';
    } catch (_) {
      $('approve').disabled = false; $('retake').disabled = false;
      $('done').textContent = 'Network issue, tap again.';
      $('done').className = 'done show err';
    }
  }
  $('approve').addEventListener('click', () => send('ok', '✓ Approved. Her page is moving on.'));
  $('retake').addEventListener('click', () => send('retake', '✗ Sent back. She\'s been told to smile properly.'));
</script>
</body>
</html>
